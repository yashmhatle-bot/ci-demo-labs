name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Message
        run: echo "Hello from GitHub Actions!"

      - name: List Files
        run: ls -la

      - name: Build Successful
        run: echo "Build completed successfully!"
